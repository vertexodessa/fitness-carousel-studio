<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Carousel Studio - Sign-in callback</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #111; }
  code { display: block; padding: .75rem; background: #f1f5f9; border-radius: 6px; word-break: break-all; }
</style>
</head>
<body>
<h1>Signing in</h1>
<p id="msg">Handing the authorization code back to the local tool...</p>
<code id="code" hidden></code>
<script>
  // TikTok redirects here after the user authorizes the app. The tool itself runs on the
  // owner's computer, so forward the query string to its local listener; if it is not
  // running, show the code so it can be pasted manually.
  var q = window.location.search;
  var local = 'http://localhost:8765/callback' + q;
  var params = new URLSearchParams(q);
  if (params.get('code')) {
    var img = new Image();
    img.onload = function () { window.location.replace(local); };
    img.onerror = function () {
      document.getElementById('msg').textContent = 'The local tool is not running. Copy this code into the terminal:';
      var el = document.getElementById('code');
      el.textContent = params.get('code');
      el.hidden = false;
    };
    img.src = 'http://localhost:8765/ping?' + Date.now();
  } else if (params.get('error')) {
    document.getElementById('msg').textContent = 'Authorization failed: ' + params.get('error_description') || params.get('error');
  } else {
    document.getElementById('msg').textContent = 'Nothing to do here. Start the sign-in from the tool.';
  }
</script>
</body>
</html>
