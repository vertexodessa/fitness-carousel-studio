<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Carousel Studio - Sign-in callback</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #111; }
  code { display: block; padding: .75rem; background: #f1f5f9; border-radius: 6px; word-break: break-all; }
</style>
</head>
<body>
<h1>Signing in</h1>
<p id="msg">Handing the authorization code back to the local tool...</p>
<code id="code" hidden></code>
<script>
  // TikTok redirects here after the user authorizes the app. The tool runs on the owner's
  // computer and listens on localhost:8765, so forward the query string there. The code is
  // shown right away so it can be pasted manually if the local tool is not running.
  var q = window.location.search;
  var params = new URLSearchParams(q);
  var msg = document.getElementById('msg');
  var el = document.getElementById('code');
  if (params.get('code')) {
    var local = 'http://localhost:8765/callback' + q;
    msg.innerHTML = 'Authorization code (paste it into the terminal if the next step does not open): ';
    el.textContent = params.get('code');
    el.hidden = false;
    var a = document.createElement('p');
    a.innerHTML = 'Forwarding to the local tool in a moment, or <a href="' + local + '">click here</a>.';
    document.body.appendChild(a);
    setTimeout(function () { window.location.replace(local); }, 1500);
  } else if (params.get('error')) {
    msg.textContent = 'Authorization failed: ' + (params.get('error_description') || params.get('error'));
  } else {
    msg.textContent = 'Nothing to do here. Start the sign-in from the tool.';
  }
</script>
</body>
</html>
